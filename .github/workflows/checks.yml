name: Checks
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            shahnur-bakery-backend/package-lock.json
            shahnur-bakery-frontend/package-lock.json
      - run: npm --prefix shahnur-bakery-backend ci
      - run: npm --prefix shahnur-bakery-frontend ci
      - run: npm test
      - run: npm run build
